<?xml version="1.0" encoding="UTF-8"?>
<!-- 手绘装饰图标集合 - Vintage Punk Gear -->
<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">

  <!-- 手绘星星 -->
  <symbol id="doodle-star" viewBox="0 0 50 50">
    <path d="M25 5 L28 18 L41 18 L31 26 L35 39 L25 31 L15 39 L19 26 L9 18 L22 18 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="25" cy="25" r="3" fill="currentColor"/>
  </symbol>

  <!-- 涂鸦圆圈 -->
  <symbol id="doodle-circle" viewBox="0 0 60 60">
    <circle cx="30" cy="30" r="25"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-dasharray="5,3"
            stroke-linecap="round"/>
    <circle cx="30" cy="30" r="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            opacity="0.5"/>
  </symbol>

  <!-- 手绘箭头 -->
  <symbol id="doodle-arrow-right" viewBox="0 0 80 40">
    <path d="M5 20 L65 20"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"/>
    <path d="M50 10 L70 20 L50 30"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- 小装饰点 -->
    <circle cx="20" cy="20" r="2" fill="currentColor"/>
    <circle cx="40" cy="20" r="2" fill="currentColor"/>
  </symbol>

  <!-- 印章/标签形状 -->
  <symbol id="stamp-badge" viewBox="0 0 100 80">
    <ellipse cx="50" cy="40" rx="45" ry="35"
             fill="none"
             stroke="currentColor"
             stroke-width="4"
             stroke-dasharray="8,4"/>
    <ellipse cx="50" cy="40" rx="38" ry="28"
             fill="none"
             stroke="currentColor"
             stroke-width="2"/>
  </symbol>

  <!-- 手绘心形 -->
  <symbol id="doodle-heart" viewBox="0 0 60 60">
    <path d="M30 50 C30 50, 10 35, 10 20 C10 10, 18 5, 25 10 C25 10, 28 13, 30 16 C32 13, 35 10, 35 10 C42 5, 50 10, 50 20 C50 35, 30 50, 30 50 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <path d="M20 18 C20 18, 22 16, 24 17"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          opacity="0.5"/>
  </symbol>

  <!-- 闪电 -->
  <symbol id="doodle-lightning" viewBox="0 0 40 60">
    <path d="M20 5 L10 25 L20 25 L15 55 L35 20 L23 20 L30 5 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </symbol>

  <!-- 骷髅头（朋克元素）-->
  <symbol id="doodle-skull" viewBox="0 0 60 70">
    <ellipse cx="30" cy="28" rx="22" ry="25"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"/>
    <circle cx="22" cy="25" r="5" fill="currentColor"/>
    <circle cx="38" cy="25" r="5" fill="currentColor"/>
    <path d="M20 35 L25 40 L30 35 L35 40 L40 35"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"/>
    <rect x="20" y="50" width="8" height="12" rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"/>
    <rect x="32" y="50" width="8" height="12" rx="2"
          fill="none"
          stroke="currentColor"
          stroke-width="2"/>
  </symbol>

  <!-- 涂鸦花朵 -->
  <symbol id="doodle-flower" viewBox="0 0 60 60">
    <circle cx="30" cy="30" r="6" fill="currentColor"/>
    <circle cx="30" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="45" cy="30" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="30" cy="45" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="15" cy="30" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="39" cy="21" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
    <circle cx="39" cy="39" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
    <circle cx="21" cy="39" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
    <circle cx="21" cy="21" r="7" fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  </symbol>

  <!-- 手绘标签/价签 -->
  <symbol id="price-tag" viewBox="0 0 80 60">
    <path d="M5 10 L60 10 L70 30 L60 50 L5 50 Z"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <circle cx="15" cy="30" r="3" fill="currentColor"/>
  </symbol>

  <!-- 波浪线 -->
  <symbol id="wavy-line" viewBox="0 0 100 20">
    <path d="M0 10 Q10 5, 20 10 T40 10 T60 10 T80 10 T100 10"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"/>
  </symbol>

  <!-- 手绘方框 -->
  <symbol id="doodle-frame" viewBox="0 0 100 100">
    <rect x="10" y="10" width="80" height="80"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          rx="5"/>
    <line x1="5" y1="5" x2="15" y2="15" stroke="currentColor" stroke-width="2"/>
    <line x1="95" y1="5" x2="85" y2="15" stroke="currentColor" stroke-width="2"/>
    <line x1="5" y1="95" x2="15" y2="85" stroke="currentColor" stroke-width="2"/>
    <line x1="95" y1="95" x2="85" y2="85" stroke="currentColor" stroke-width="2"/>
  </symbol>

  <!-- 胶带效果 -->
  <symbol id="tape" viewBox="0 0 120 30">
    <rect x="5" y="5" width="110" height="20"
          fill="rgba(255, 248, 220, 0.8)"
          stroke="rgba(0,0,0,0.1)"
          stroke-width="1"
          rx="2"/>
    <line x1="15" y1="5" x2="15" y2="25"
          stroke="rgba(0,0,0,0.05)"
          stroke-width="1"
          stroke-dasharray="2,2"/>
    <line x1="105" y1="5" x2="105" y2="25"
          stroke="rgba(0,0,0,0.05)"
          stroke-width="1"
          stroke-dasharray="2,2"/>
  </symbol>

  <!-- 撕纸边缘效果 -->
  <symbol id="torn-edge" viewBox="0 0 100 10" preserveAspectRatio="none">
    <path d="M0 0 L5 2 L8 0 L13 3 L18 1 L23 2 L28 0 L33 3 L38 1 L43 2 L48 0 L53 3 L58 1 L63 2 L68 0 L73 3 L78 1 L83 2 L88 0 L93 3 L98 1 L100 0 L100 10 L0 10 Z"
          fill="currentColor"/>
  </symbol>

</svg>
